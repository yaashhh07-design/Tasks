<body>
    <h1>A Nested Lists</h1>
    <div>
        <ul>
            <li>Coffee</li>
            <ol type="1">
                <dt>
                    <li>Black Coffee</li>
                </dt>
                <dd>-Black Hot Cofee</dd>
                <dt>
                    <li>White Coffee</li>
                <dd>-White Hot Cofee</dd>
            </ol>
            <li>Tea</li>
            <ol>
                <li>Black Tea</li>
                <li>Green Tea</li>
            </ol>
            <li>Milk</li>
        </ul>
    </div>
</body>
