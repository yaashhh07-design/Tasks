<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="margin-left: 60px;">
        <h2>Example of font tag</h2>
        <nav>
            <li>This is Normal text Without any font styling</li><br>
        </nav>
        <nav style="color: blue;">
            <li>Text with normal size and default face</li>
        </nav>
        <nav style="color: green;">
            <h2>Text with Increased size and default face</h2>
        </nav>
        <nav style="color: red;font-style: oblique;">
            <li>Text with different font and changed face</li>
        </nav>
    </div>
</body>
</html>
