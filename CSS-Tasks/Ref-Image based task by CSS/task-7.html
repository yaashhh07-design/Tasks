<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .ar1 {
        display: flex;
        align-items: center;
        position: absolute;
        width: 400px;
        height: 10px;
        background: linear-gradient(to right, transparent, green);
        position: relative;
        top: -40px;
        left: 350px;
    }

    .ar1::after {
        content: '';
        position: absolute;
        right: -5px;
        border-top: 20px solid transparent;
        border-bottom: 20px solid transparent;
        border-left: 20px solid green;
    }

    .ar2 {
        position: relative;
        width: 10px;
        height: 400px;
        margin: 20px auto;
        background: linear-gradient(to bottom, transparent, green);
        position: relative;
        right: 600px;
    }

    .ar2::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-top: 25px solid green;
    }

    #a {
        margin-left: 550px;
        margin-top: 100px;
    }

    #b {
        width: 890px;
        height: 400px;
        background-color: goldenrod;
        position: absolute;
        top: 230px;
        left: 500px;
    }

    #p1 {
        color: white;
        padding-top: 130px;
        padding-left: 500px;
        font-size: xxx-large;
    }

    #c {
        width: 200px;
        height: 400px;
        background-color: maroon;
        position: absolute;
        top: 230px;
        left: 500px;
    }

    #p2 {
        color: white;
        padding: 20px;
        font-size: xxx-large;
        padding-top: 130px;
        padding-left: 40px;
    }

    #d {
        width: 890px;
        height: 70px;
        background-color: aqua;
        position: absolute;
        top: 160px;
        left: 500px;
    }

    #p3 {
        color: white;
        font-size: xxx-large;
        padding-left: 30px;
        margin-top: 10px;
    }

    #e {
        width: 890px;
        height: 80px;
        background-color: aqua;
        position: absolute;
        top: 630px;
        left: 500px;
    }

    #p4 {
        color: white;
        padding: 10px;
        font-size: xxx-large;
        padding-left: 30px;
        position: absolute;
        top: -50px;
    }
</style>

<body>
    <div id="a">
        <h1><i>Two-Dimensional</i></h1>
        <div class="ar1"></div>
        <div class="ar2"></div>
    </div>
    <div id="b">
        <p id="p1">Content</p>
    </div>
    <div id="c">
        <p id="p2">Menu</p>
    </div>
    <div id="d">
        <p id="p3">Header</p>
    </div>
    <div id="e">
        <p id="p4">Footer</p>
    </div>
</body>

</html>
