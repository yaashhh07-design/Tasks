<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: black;
        height: 100vh;
        margin: 0;
    }
    
    .a {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .word {
        color: white;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 900;
        font-size: 25px;
        letter-spacing: 30px;
        padding: 15px;
    }

    .line {
        width: 320px;
        height: 12px;
        background-color: aqua;
        margin: 5px;
    }
</style>

<body>
    <div class="a">
        <div class="word">TEN</div>
        <div class="line"></div>
        <div class="word">NINE</div>
        <div class="line"></div>
        <div class="word">EIGHT</div>
        <div class="line"></div>
        <div class="word">SEVEN</div>
        <div class="line"></div>
        <div class="word">SIX</div>
        <div class="line"></div>
        <div class="word">FIVE</div>
        <div class="line"></div>
        <div class="word">FOUR</div>
        <div class="line"></div>
        <div class="word">THREE</div>
        <div class="line"></div>
        <div class="word">TWO</div>
        <div class="line"></div>
        <div class="word">ONE</div>
    </div>
</body>

</html>
