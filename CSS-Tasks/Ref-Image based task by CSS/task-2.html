<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    #a{
        height: 100vh;
        background-color: bisque;
    }
    #p1{
        position: absolute;
        top: 300px;
        left: 800px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: large;
        z-index: 1;
    }
    #b{
        width: 100%;
        height: 150px;
        background-color: aqua;
        position: absolute;
        top: 0;
        z-index: 3;
    }
    h1{
        padding: 40px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: xx-large;
    }
    #c{

        width: 30%;
        height: 100vh;
        background-color: blue;
        position: absolute;
        top: 0px;
    }
    ul{
         position: absolute;
         top: 150px;
    }
    li{
       color: #e0c200dc;
       list-style: none;  
       margin-top: 10px;
    }
    #d{
        width: 100%;
        height: 90px;
        background-color: chocolate;
        position: absolute;
        bottom: 0;
    }
    #p2{
        font-size: x-large;
        color: darkblue;
        text-align: center;
        padding: 10px;
    }
</style>
<body>
    <div id="a"><p id="p1">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Welcome To Our Website<br><br> This is the most Amazing Website</p></div>
    <div id="b"><h1>My First Website</h1></div>
    <div id="c">
        <ul>
              <li>Home</li>
               <li>About</li>
               <li>Info</li>
               <li>Contact</li>
        </ul>
    </div>
    <div id="d"><p id="p2">CopyRight &copy; Codingaddict.com</p></div>
</body>
</html>
