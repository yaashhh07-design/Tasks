<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    form {
        width: 500px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input,
    textarea {
        width: 90%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 3px;
    }

    button {
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
    }

    button:hover {
        background-color: #218838;
    }

    textarea {
        resize: none;
        height: 50px;
    }

    span {
        color: red;
    }

    label,
    input,
    textarea,
    button {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: bold;
    }
</style>

<body>
    <form id="form" onsubmit="return validate()">
        <p>
            <label><span>*</span> Full Name</label>
            <input type="text" id="name" required placeholder="Enter your name">
        </p>

        <p>
            <label><span>*</span> Age</label>
            <input type="number" id="age" required placeholder="Enter your age">
        </p>

        <p>
            <label>&nbsp;&nbsp;Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">
        </p>

        <p>
            <label>&nbsp;&nbsp;Your Message</label>
            <textarea id="message" placeholder="Share your feedback"></textarea>
        </p>

        <p>
            <button type="submit" id="btn">Send Message</button>
        </p>
    </form>
    <script>
        let attempts = 3;
        function validate() {
            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let phone = document.getElementById("phone").value;
            let message = document.getElementById("message").value;
            let btn = document.getElementById("btn");

            if (name === "Heisenberg" && age === "50" && phone === "1234567890") 
            {
                alert("Login successfully");
                window.location.href = "https://www.marvel.com/movies";
                return false; 
            } 
            else {
                attempts--;
                alert("You have " + attempts + " attempts left.");
                document.getElementById("form").reset();
            }

            if (attempts === 0) {
                alert("You have been locked out due to too many failed attempts.");
                document.getElementById("name").disabled = true;
                document.getElementById("age").disabled = true;
                document.getElementById("phone").disabled = true;
                document.getElementById("message").disabled = true;
                document.getElementById("btn").disabled = true;
            }

            return false;
        }
    </script>
</body>

</html>
