<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #btn {
        width: 150px;
        height: 100px;
        border-radius: 10px;
        position: relative;
        top: -450px;
        font-size: xx-large;
        background-color: red;
        color: white;
    }
    #btn:hover {
        background-color: darkred;
        color: lightgrey;
    }
</style>
<body>
    <div id="content">
        <button id="btn" onclick="previous()">&lt;</button>
        <img src="" alt="" id="imgs" width="500px" height="900px">
        <button id="btn" onclick="next()">&gt;</button>
    </div>
    <script>
        let img = ["./Images/Armored-Titan.jpg",
            "./Images/Attack-Titan.jpg",
            "./Images/Beast-Titan.jpg",
            "./Images/Armored-Titan.jpg",
            "./Images/Colossal-Titan.jpg",
            "./Images/Cart-Titam.jpg",
            "./Images/Jaw-Titan.jpg",
            "./Images/War-Hammer-Titan.jpg",
            "./Images/Founding-Titan.jpg",];
        let i = 0;
        document.getElementById("imgs").src = img[i];
        function next() {
            i++;
            if (i >= img.length) {
                i = 0;
            }
            document.getElementById("imgs").src = img[i];
        }

        function previous() {
            i--;
            if (i < 0) {
                i = img.length - 1;
            }
            document.getElementById("imgs").src = img[i];
        }
        setInterval(next, 10000);
    </script>
</body>

</html>
