<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    input {
        width: 360px;
        height: 50px;
        text-align: right;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: x-large;
        margin-left: 15px;
    }

    button {
        width: 70px;
        height: 70px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: large;

    }

    #num{
        background-color: orangered;
        color: white;
    }
    #num:hover{
        background-color: red;
        color: lightgray;
    }
    #sym{
        background-color: lightgray;
        color: black;
    }
    #sym:hover{
        background-color: grey;
        color: black;
    }

    #content {
        width: 400px;
        height: 450px;
        border: 2px solid black;
    }

    #btn {
        margin-left: 15px;
    }
</style>

<body>
    <div id="content">
        <p><input type="text" id="input" placeholder="Enter The number"></p>
        <div id="btn">
            <button id="num" onclick="dis('1')">1</button>
            <button id="num" onclick="dis('2')">2</button>
            <button id="num" onclick="dis('3')">3</button>
            <button id="sym" onclick="dis('+')">+</button>
            <button id="sym" onclick="dis('-')">-</button><br><br>
            <button id="num" onclick="dis('4')">4</button>
            <button id="num" onclick="dis('5')">5</button>
            <button id="num" onclick="dis('6')">6</button>
            <button id="sym" onclick="dis('*')">*</button>
            <button id="sym" onclick="dis('/')">/</button><br><br>
            <button id="num" onclick="dis('7')">7</button>
            <button id="num" onclick="dis('8')">8</button>
            <button id="num" onclick="dis('9')">9</button>
            <button id="sym" onclick="clr()">CLEAR</button>
            <button id="sym" onclick="solve()">=</button><br><br>
            <button id="num" onclick="dis('0')">0</button>
            <button id="sym" onclick="dis('%')">%</button>
            <button id="sym" onclick="dis('.')">.</button>
            <button id="sym" onclick="clr()">AC</button>
            <button id="sym" onclick="backspace()">Erase</button>
        </div>
    </div>
    <script>
        function dis(val) {
            document.getElementById("input").value += val;
        }
        function clr() {
            document.getElementById("input").value = "";
        }
        function solve() {
            var x = document.getElementById("input").value;
            var y = eval(x);
            document.getElementById("input").value = y;
        }
        function backspace() {
            var x = document.getElementById("input").value;
            document.getElementById("input").value = x.substr(0, x.length - 1);
        }
    </script>
</body>

</html>
