<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        text-align: center;
    }

    #content {
        margin-top: 20px;
        background-color: grey;
        width: 500px;
        height: 400px;
        margin-left: auto;
        margin-right: auto;
        border-radius: 1000px;
        border: 4px solid black;
        position: relative;
        top: 80px;
    }

    h2 {
        width: 200px;
        text-align: center;
        padding: 50px;
        margin: 50px;
        font-size: xx-large;
        background-color: black;
        color: white;
        border-radius: 1000px;
    }
    div
    {
        display: flex;
        justify-content: center;
        background-color: lightgray;
        width: 400px;
        border-radius: 1000px;
        margin: auto;
    }
</style>

<body>
    <h1>Digital Clock</h1>
    <div id="content">
        <div>
            <h2 id="h2"></h2>
        </div>
    </div>
    <script>
        let a = () => {
            let d = new Date();
            hr = d.getHours();
            min = d.getMinutes();
            sec = d.getSeconds();
            document.querySelector("h2").innerHTML = hr + " : " + min + " : " + sec;
        }
        setInterval(a, 1000);
    </script>
</body>

</html>
